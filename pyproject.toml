[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "provctl"
version = "0.1.4"
description = "Provenance-weighted dependency risk gate for Python projects"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

# Deliberately minimal. A supply-chain security tool should have a near-zero
# dependency tree; every runtime dependency is an entry in its own threat model.
# `packaging` is the PyPA-standard name normalizer and the only exception.
dependencies = ["packaging>=23.0"]

[project.urls]
Homepage = "https://github.com/chirataandrei/provctl"
Repository = "https://github.com/chirataandrei/provctl"
Issues = "https://github.com/chirataandrei/provctl/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
provctl = "provctl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["provctl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
